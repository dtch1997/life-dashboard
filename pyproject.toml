[project]
name = "life-dashboard"
version = "0.1.0"
description = "Personal life dashboard built with Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "streamlit>=1.32.0",
    "todoist-api-python>=3.1.0",
    "plotly>=5.0.0",
    "pydantic>=2.12.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.8.0",
    "ty",
]
